services:
  postgres-integration:
    image: postgres:16-alpine
    container_name: cost-management-integration-db
    environment:
      POSTGRES_DB: cost_management_integration_test
      POSTGRES_USER: cost_management_test
      POSTGRES_PASSWORD: cost_management_test_only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cost_management_test -d cost_management_integration_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - cost-management-integration-postgres:/var/lib/postgresql/data

volumes:
  cost-management-integration-postgres:
